<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vercel Toolbar external-fork PoC</title>
  <style>
    :root { font: 18px/1.45 system-ui, sans-serif; color-scheme: light dark; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(44rem, calc(100vw - 2rem)); text-align: center; }
    button { font: 700 1.1rem system-ui, sans-serif; padding: .8rem 1.6rem; }
    pre { padding: 1rem; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <button id="launch" type="button" disabled>LAUNCH</button>
    <pre id="result" hidden></pre>
  </main>
  <script src="/poc.js"></script>
</body>
</html>
